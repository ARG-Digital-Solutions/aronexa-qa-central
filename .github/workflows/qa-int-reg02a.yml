name: AroNexa P01-T07 INT-REG02A Independent Frontend QA
run-name: "INT-REG02A ${{ inputs.request_id || 'manual' }} / ${{ inputs.app_sha }}"
# Test-only. No backend, database, customer data or deployment.
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Exact reviewed product PR 67 head SHA
        required: true
        type: string
      acknowledge_disposable_only:
        description: I authorize synthetic-only UI tests, no real patient or original database
        required: true
        type: boolean
        default: false
      request_id:
        description: Audit correlation only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: int-reg02a-${{ inputs.app_sha }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check reviewed plan and exact synthetic PR source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - name: Reject unreviewed SHA, plan, PR or missing authorization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARONEXA_SOURCE_READ_TOKEN }}
          APP_SHA: ${{ inputs.app_sha }}
          ACK: ${{ inputs.acknowledge_disposable_only }}
        run: |
          set -euo pipefail
          test "$ACK" = "true"
          test -n "$GH_TOKEN"
          [[ "$APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          PLAN=qa/qa/plans/P01_T07_INT_REG_02A.json
          test -f "$PLAN"
          test "$(jq -r '.plan_id' "$PLAN")" = "P01_T07_INT_REG_02A"
          test "$(jq -r '.qa_workflow' "$PLAN")" = "qa-int-reg02a.yml"
          test "$(jq -r '.approved_source_sha' "$PLAN")" = "$APP_SHA" || {
            echo "Unreviewed source change: update plan and reapprove" >&2; exit 1;
          }
          test "$(jq -r '.source_baseline_sha' "$PLAN")" = "52809efbc077cd6abb6860d870cc487cc8eddc42"
          test "$(jq -r '.source_pr_number' "$PLAN")" = "67"
          test "$(jq -r '.test_only' "$PLAN")" = "true"
          test "$(jq -r '.customer_release_allowed_on_ci_pass' "$PLAN")" = "false"
          gh api repos/ARG-Digital-Solutions/aronexa-healthcare-platform/pulls/67 |
            jq -e --arg sha "$APP_SHA" '
              .state == "open" and .head.sha == $sha and
              .head.repo.full_name == "ARG-Digital-Solutions/aronexa-healthcare-platform" and
              .base.ref == "feature/p01-t07-appointments-demo-20261108"
            ' >/dev/null
          echo "Exact reviewed PR and synthetic-only guard PASS"

  frontend:
    name: Pinned frontend build, contract, model and Playwright QA
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ARG-Digital-Solutions/aronexa-healthcare-platform
          ref: ${{ inputs.app_sha }}
          token: ${{ secrets.ARONEXA_SOURCE_READ_TOKEN }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact commit, three-file scope and no live adapter
        shell: bash
        working-directory: app
        env:
          APP_SHA: ${{ inputs.app_sha }}
          BASE_SHA: 52809efbc077cd6abb6860d870cc487cc8eddc42
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 3
          for file in "${changed[@]}"; do
            case "$file" in
              frontend/src/registrationContractPreview.ts|frontend/test/registration-contract-preview.test.mjs|docs/phases/P01_T07_INT_REG02A_SYNTHETIC_SEAM.md) ;;
              *) echo "Unapproved changed path: $file" >&2; exit 1 ;;
            esac
          done
          if grep -Fq 'registrationContractPreview' frontend/src/App.tsx; then
            echo "Live/demo App.tsx must not invoke the preview adapter" >&2; exit 1
          fi
          if grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|localStorage|sessionStorage|sendBeacon[[:space:]]*\(' frontend/src/registrationContractPreview.ts; then
            echo "Network/storage activity forbidden" >&2; exit 1
          fi
      - name: Stage exact product source and reviewed QA code outside credential checkout
        shell: bash
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C qa rev-parse HEAD)" = "$GITHUB_SHA"
          stage="$(mktemp -d "$RUNNER_TEMP/int-reg02a.XXXXXX")"
          mkdir -p "$stage/app" "$stage/qa"
          # Archive immutable contents only; never share either .git directory
          # or the token-bearing runner workspace with the test container.
          git -C app archive "$APP_SHA" frontend | tar -x -C "$stage/app"
          git -C qa archive "$GITHUB_SHA" | tar -x -C "$stage/qa"
          mkdir -p "$stage/qa/artifacts"
          echo "INT_REG02A_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Install locked npm dependencies without lifecycle scripts
        shell: bash
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d # v1.65.0-noble
        run: |
          set -euo pipefail
          test -n "$INT_REG02A_STAGE"
          for directory in "$INT_REG02A_STAGE/app/frontend" "$INT_REG02A_STAGE/qa"; do
            docker run --rm --user "$(id -u):$(id -g)" \
              --cap-drop=ALL --security-opt=no-new-privileges --env HOME=/tmp \
              --mount "type=bind,src=$directory,dst=/work" --workdir /work \
              "$PLAYWRIGHT_IMAGE" npm ci --ignore-scripts --no-audit --no-fund
          done
      - name: Execute untrusted frontend and independent browser QA without network or credentials
        shell: bash
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d # v1.65.0-noble
        run: |
          set -euo pipefail
          test -n "$INT_REG02A_STAGE"
          docker run --rm -i --init --network none --shm-size=1g \
            --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt=no-new-privileges \
            --env HOME=/tmp --env CI=true --env ARONEXA_BASE_URL=http://127.0.0.1:5175/ \
            --mount "type=bind,src=$INT_REG02A_STAGE/app/frontend,dst=/work/frontend" \
            --mount "type=bind,src=$INT_REG02A_STAGE/qa,dst=/work/qa" \
            "$PLAYWRIGHT_IMAGE" bash -se <<'RUN_OFFLINE'
          set -euo pipefail
          # Docker --network none: confirm no non-loopback route is present.
          if tail -n +2 /proc/net/route | grep -Eq '^[^[:space:]]+[[:space:]]+00000000[[:space:]]'; then
            echo "Network isolation failed: default route present" >&2
            exit 1
          fi
          cd /work/frontend
          npm run build
          node --experimental-strip-types --test test/registration-contract-preview.test.mjs | tee /tmp/int-reg02a-contract.tap
          grep -qx '# pass 10' /tmp/int-reg02a-contract.tap
          grep -qx '# fail 0' /tmp/int-reg02a-contract.tap
          node --experimental-strip-types --test test/reception-demo.test.mjs | tee /tmp/int-reg02a-reception.tap
          grep -qx '# pass 26' /tmp/int-reg02a-reception.tap
          grep -qx '# fail 0' /tmp/int-reg02a-reception.tap
          node --experimental-strip-types --test test/appointment-demo.test.mjs | tee /tmp/int-reg02a-appointments.tap
          grep -qx '# pass 20' /tmp/int-reg02a-appointments.tap
          grep -qx '# fail 0' /tmp/int-reg02a-appointments.tap
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5175 --strictPort >/tmp/int-reg02a-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module - <<'READY'
          for (let attempt=0; attempt<30; attempt++) {
            const response=await fetch("http://127.0.0.1:5175/",{signal:AbortSignal.timeout(1000)}).catch(()=>null);
            if(response?.ok) process.exit(0);
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          process.exit(1);
          READY
          cd /work/qa
          ./node_modules/.bin/playwright test -c playwright.config.mjs tests/verified --project chromium-desktop
          RUN_OFFLINE
      - name: Retrieve regular, non-symlink browser test artifacts
        if: always() && env.INT_REG02A_STAGE != ''
        shell: bash
        run: |
          set -euo pipefail
          source="$INT_REG02A_STAGE/qa/artifacts"
          mkdir -p qa/artifacts
          if test -d "$source"; then
            (cd "$source" && find . -type f -links 1 -exec cp --parents -- {} "$GITHUB_WORKSPACE/qa/artifacts" \;)
          fi
      - name: Record synthetic source provenance
        if: always()
        shell: bash
        env:
          APP_SHA: ${{ inputs.app_sha }}
        run: |
          mkdir -p qa/artifacts/int-reg02a
          python3 - <<'PY'
          import datetime, json, os, pathlib
          record={
            "plan":"P01_T07_INT_REG_02A","product_pr":67,
            "source_sha":os.environ["APP_SHA"],
            "qa_workflow_sha":os.environ["GITHUB_SHA"],
            "run_id":os.environ["GITHUB_RUN_ID"],
            "run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "executed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "data":"synthetic-only","real_patient_data":False,
            "live_backend_connection":False,"release_authorized":False,
            "test_outcome":"SEE_JOBS_AND_TEST_REPORTS"
          }
          pathlib.Path("qa/artifacts/int-reg02a/provenance.json").write_text(json.dumps(record,indent=2)+"\n")
          PY
      - name: Upload Playwright traces and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-reg02a-${{ github.run_id }}
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 14
