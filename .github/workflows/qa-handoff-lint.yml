name: Validate Central QA Plans and Workflows
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-central-qa:
    name: Validate reviewed plan schema and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject incomplete or unsafe QA plan declarations
        run: python3 scripts/check_qa_plans.py
      - name: Prove QA plan validation fails closed under unsafe mutations
        run: python3 scripts/test_qa_plans.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Statically lint QA workflows without secrets
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= \
            .github/workflows/qa-cross-repo-handoff.yml \
            .github/workflows/qa-int-reg01.yml \
            .github/workflows/qa-int-reg02a.yml \
            .github/workflows/qa-handoff-lint.yml

  int-reg02a-review-ci:
    name: INT-REG02A pre-merge exact-source frontend acceptance
    # Only this controlled same-repo QA planning PR may request this review evidence.
    # Uses a read-only source token for checkout; no product writes, dispatch or DB.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'qa/p01-t07-int-reg02a-plan-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout QA planning PR with no persisted credentials
        uses: actions/checkout@v4
        with:
          path: qa
          persist-credentials: false
      - name: Validate pin, plan and currently open product PR before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARONEXA_SOURCE_READ_TOKEN }}
          APP_SHA: f8b7f7b8294be52df0336d5e619f43b55450c976
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "Missing read-only source token" >&2; exit 1; }
          PLAN=qa/qa/plans/P01_T07_INT_REG_02A.json
          test "$(jq -r '.plan_id' "$PLAN")" = "P01_T07_INT_REG_02A"
          test "$(jq -r '.approved_source_sha' "$PLAN")" = "$APP_SHA"
          test "$(jq -r '.source_baseline_sha' "$PLAN")" = "52809efbc077cd6abb6860d870cc487cc8eddc42"
          test "$(jq -r '.source_pr_number' "$PLAN")" = "67"
          test "$(jq -r '.test_only' "$PLAN")" = "true"
          test "$(jq -r '.customer_release_allowed_on_ci_pass' "$PLAN")" = "false"
          gh api repos/ARG-Digital-Solutions/aronexa-healthcare-platform/pulls/67 |
            jq -e --arg sha "$APP_SHA" '
              .state == "open" and .head.sha == $sha and
              .head.repo.full_name == "ARG-Digital-Solutions/aronexa-healthcare-platform" and
              .base.ref == "feature/p01-t07-appointments-demo-20261108"
            ' >/dev/null
          echo "Reviewed exact product PR #67 current head and test-only plan PASS"
      - name: Checkout exact product source SHA with no persisted credentials
        uses: actions/checkout@v4
        with:
          repository: ARG-Digital-Solutions/aronexa-healthcare-platform
          ref: f8b7f7b8294be52df0336d5e619f43b55450c976
          token: ${{ secrets.ARONEXA_SOURCE_READ_TOKEN }}
          fetch-depth: 0
          path: app
          persist-credentials: false
      - name: Verify three-file source scope and forbid live API connection
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f8b7f7b8294be52df0336d5e619f43b55450c976"
          base=52809efbc077cd6abb6860d870cc487cc8eddc42
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          test "${#changed[@]}" -eq 3
          for path in "${changed[@]}"; do
            case "$path" in
              frontend/src/registrationContractPreview.ts|frontend/test/registration-contract-preview.test.mjs|docs/phases/P01_T07_INT_REG02A_SYNTHETIC_SEAM.md) ;;
              *) echo "Out of scope path: $path" >&2; exit 1;;
            esac
          done
          test -z "$(git diff --name-only "$base" HEAD -- frontend/src/App.tsx frontend/src/receptionModel.ts frontend/src/appointmentModel.ts)"
          if grep -Fq 'registrationContractPreview' frontend/src/App.tsx; then
            echo "Unapproved App.tsx import of test-only adapter" >&2; exit 1
          fi
          if grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|localStorage|sessionStorage|sendBeacon[[:space:]]*\(' frontend/src/registrationContractPreview.ts; then
            echo "Network/storage activity forbidden" >&2; exit 1
          fi
          echo "Source SHA + three-file isolation PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install and compile exact PR 67 frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run new contract preview tests, Reception and Appointment models
        shell: bash
        working-directory: app/frontend
        run: |
          set -euo pipefail
          node --experimental-strip-types --test test/registration-contract-preview.test.mjs | tee /tmp/reg02a-contract.tap
          grep -qx '# pass 10' /tmp/reg02a-contract.tap
          grep -qx '# fail 0' /tmp/reg02a-contract.tap
          node --experimental-strip-types --test test/reception-demo.test.mjs | tee /tmp/reg02a-reception.tap
          grep -qx '# pass 26' /tmp/reg02a-reception.tap
          grep -qx '# fail 0' /tmp/reg02a-reception.tap
          node --experimental-strip-types --test test/appointment-demo.test.mjs | tee /tmp/reg02a-appointments.tap
          grep -qx '# pass 20' /tmp/reg02a-appointments.tap
          grep -qx '# fail 0' /tmp/reg02a-appointments.tap
          echo "Exact product SHA: 10 contract + 26 Reception + 20 Appointments tests passed"
      - name: Install reviewed Playwright dependencies
        working-directory: qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify unchanged synthetic Reception browser workflows on localhost
        shell: bash
        env:
          ARONEXA_BASE_URL: http://127.0.0.1:5175/
        run: |
          set -euo pipefail
          (cd app/frontend && npm run dev -- --host 127.0.0.1 --port 5175 --strictPort) >/tmp/reg02a-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail "$ARONEXA_BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail "$ARONEXA_BASE_URL" >/dev/null
          (cd qa && npx playwright test tests/verified --project chromium-desktop)
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path("qa/artifacts/results.xml")).getroot()
          tests = int(root.get("tests", 0)) or sum(int(x.get("tests",0)) for x in root.findall("testsuite"))
          failures = int(root.get("failures", 0)) + int(root.get("errors", 0))
          if root.tag == "testsuites":
              failures = sum(int(x.get("failures",0))+int(x.get("errors",0)) for x in root.findall("testsuite"))
          if tests != 8 or failures:
              raise SystemExit(f"Expected 8 clean browser tests, got {tests} tests and {failures} failures")
          print(f"Exact product SHA: verified {tests}/8 browser tests PASS")
          PY
      - name: Upload independent synthetic browser traces for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-reg02a-premerge-${{ github.run_id }}
          path: qa/artifacts/
          if-no-files-found: warn
          retention-days: 14
